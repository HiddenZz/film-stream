services:
  miniosolo:
    image: minio/minio:latest
    container_name: miniosolo
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server --console-address ":9001" /data
    volumes:
      - ./miniosolo:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  postgres:
    image: postgres:17.3
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie
      POSTGRES_DB: movie
    ports:
      - "5432:5432"
    networks:
      - postgres_network


networks:
  postgres_network:

volumes:
  minio_dev_data:
  postgres_data: