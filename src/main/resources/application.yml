network:
  rest-template:
    parse-host: "https://api4.rhserv.vu/"

parsers:
  movie:
    lumex:
      name: "videocdn"
      host: "https://api.lumex.space"
    veveo:
      api-token-header-name: "dle-api-token"
      content-map-url: "https://api.rstprgapipt.com/dle-plugin/balancer-api/proxy/playlists/catalog-api/episodes"
      query-param-for-request-content: "content-id"
      query-param-movie-id-for-parse-name: "movie_id"
      name: "veoveo50-cdn"


storage:
  minio:
    credentials:
      endpoint: http://127.0.0.1:9000/
      name: "minioadmin"
      password: "minioadmin123"
    buckets:
      top-prefix: content
      hls-name: "index.m3u8"
  redis:
    torrent-cache-per-seconds: 4000
    download-stream: stream:download,
    stream-message-head-key: data





torrent:
  jackett:
    url: http://localhost:9117/api/v2.0/
    apiKey: d20mpf01xc8p2j0o2feizx4w5p5p763r


server:
  port: 8084


spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: film_stream
    default-schema: film_stream
  datasource:
    url: jdbc:postgresql://localhost:5432/movie?currentSchema=film_stream
    username: movie_user
    password: movie
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379


# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.film.parser.feature.playlist.data
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  type-handlers-package: org.film.parser.feature.playlist.data.typehandler

logging:
  level:
    org.apache.ibatis: DEBUG
    org.film.parser.feature.movie.detail.repository: TRACE
    org.film.parser.feature.playlist.repository: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.springframework.web.client.RestTemplate: DEBUG
    org.apache.http: DEBUG
    httpclient.wire: DEBUG
    org.film.parser: DEBUG
