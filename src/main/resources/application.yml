network:
  rest-template:
    parse-host: "https://api4.rhhhhhhh.live/"

parsers:
  movie:
    lumex:
      name: "videocdn"
      host: "https://api.lumex.space"


storage:
  minio:
    credentials:
      endpoint: http://127.0.0.1:9000/
      name: "minioadmin"
      password: "minioadmin123"
    buckets:
      top-prefix: content
      hls-name: "index.m3u8"


server:
  port: 8084


spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: film_stream
    default-schema: film_stream
  datasource:
    url: jdbc:postgresql://localhost:5432/movie?currentSchema=film_stream
    username: movie_user
    password: movie
    driver-class-name: org.postgresql.Driver


# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.film.parser.feature.playlist.data
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  type-handlers-package: org.film.parser.feature.playlist.data.typehandler

logging:
  level:
    org.apache.ibatis: DEBUG
    org.film.parser.feature.movie.detail.repository: TRACE
    org.film.parser.feature.playlist.repository: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.springframework.web.client.RestTemplate: DEBUG
    org.apache.http: DEBUG
    httpclient.wire: DEBUG
    org.film.parser: DEBUG
